<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// __PARAMS__ is substituted by the backend's scenario renderer; left
// unsubstituted (dev/test) the try/catch yields an empty map.
const SCENARIO_PARAMS = (() => {
  try { return __PARAMS__; } catch { return {}; }
})();

const stage = document.getElementById('stage');

// ---------------- three setup ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

// Sandboxed srcdoc iframes can't be transparent (opaque white in
// Chrome), so the doc body paints the board color instead — the host
// syncs live changes over postMessage. The renderer stays alpha so
// that color is what shows through.
const scene = new THREE.Scene();
const setBoardBg = (c) => {
  document.documentElement.style.background = c;
  document.body.style.background = c;
};
window.parent.postMessage({
  source: 'ai4edu', type: 'ready',
  artifactId: window.__AI4EDU_ARTIFACT_ID__ }, '*');
addEventListener('message', (e) => {
  const d = e.data;
  if (d && d.source === 'ai4edu' && typeof d.boardBg === 'string' &&
      /^#[0-9a-f]{3,8}$/i.test(d.boardBg)) setBoardBg(d.boardBg);
});
const camera = new THREE.PerspectiveCamera(
  40, stage.clientWidth / stage.clientHeight, 0.01, 100);
camera.position.set(2.4, 1.7, 3.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.085;

scene.add(new THREE.HemisphereLight(0xffffff, 0xa7acb2, 1.05));
const key = new THREE.DirectionalLight(0xfffaf4, 2.1);
key.position.set(-2, 4, 3);
scene.add(key);
const rim = new THREE.DirectionalLight(0xe9f0ff, 1.6);
rim.position.set(2, 2, -3);
scene.add(rim);

new ResizeObserver(() => {
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
}).observe(stage);
renderer.setSize(stage.clientWidth, stage.clientHeight);

// Everything transformable lives in one group so the gizmo moves the
// whole sim as a unit.
const shape = new THREE.Group();
scene.add(shape);


// ---------------- sim helpers ----------------
const TICKS = [];
const tick = (f) => TICKS.push(f);

const paramsEl = document.getElementById('params');
// Control keys = normalized labels ('major R' -> 'major_r'); a scenario
// seeds any control by that key via __PARAMS__. The handler fires once
// on registration with the initial value, so sims need no separate
// default-init call.
const pKey = (l) =>
  l.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
function param(label, min, max, val, step, fn) {
  const sv = SCENARIO_PARAMS[pKey(label)];
  const init = typeof sv === 'number' && isFinite(sv) ? sv : val;
  const row = document.createElement('label');
  row.className = 'param';
  const name = document.createElement('span');
  name.className = 'pname';
  name.textContent = label;
  const inp = document.createElement('input');
  inp.type = 'range';
  inp.min = min; inp.max = max; inp.step = step; inp.value = init;
  const out = document.createElement('span');
  out.className = 'pval';
  out.textContent = init;
  inp.addEventListener('input', () => {
    const v = +inp.value;
    out.textContent = Math.round(v * 100) / 100;
    fn(v);
  });
  row.append(name, inp, out);
  paramsEl.append(row);
  fn(init);
  return row;
}
function pick(label, options, fn) {
  const sv = SCENARIO_PARAMS[pKey(label)];
  const init = sv != null && sv !== '' ? String(sv) : options[0];
  const row = document.createElement('label');
  row.className = 'param';
  const name = document.createElement('span');
  name.className = 'pname';
  name.textContent = label;
  const sel = document.createElement('select');
  for (const opt of options) {
    const o = document.createElement('option');
    o.value = o.textContent = opt;
    sel.append(o);
  }
  const canonical = options.find(
    (o) => o.toLowerCase() === init.toLowerCase());
  if (canonical) sel.value = canonical;
  sel.addEventListener('change', () => fn(sel.value));
  row.append(name, sel);
  paramsEl.append(row);
  fn(init);
  return row;
}

// ---------------- flatten ----------------
let FLAT = 0, FLATTGT = 0;
const flat = () => FLAT;
const FLATCHBS = [];
const onFlatten = (f) => FLATCHBS.push(f);
const DW = 3.0, DH = 2.0;             // flat domain rect size
const chart = (u, v) =>
  new THREE.Vector3((u - 0.5) * DW, (v - 0.5) * DH, 0);

const FLATMESHES = [];
function flattenMesh(mesh) {
  const geo = mesh.geometry;
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  if (!pos || !uv) return;
  FLATMESHES.push({ mesh, pos, uv, base: pos.array.slice() });
}
let _flatApplied = -1;
// Sims that rebuild geometry call this before re-registering flattenMesh.
const clearFlat = () => { FLATMESHES.length = 0; _flatApplied = -1; };
function applyFlatten() {
  if (FLAT === _flatApplied) return;
  _flatApplied = FLAT;
  for (const f of FLATMESHES) {
    const p = f.pos;
    for (let i = 0; i < p.count; i++) {
      const tx = (f.uv.getX(i) - 0.5) * DW;
      const ty = (f.uv.getY(i) - 0.5) * DH;
      p.setXYZ(i,
        f.base[i * 3]     + (tx - f.base[i * 3])     * FLAT,
        f.base[i * 3 + 1] + (ty - f.base[i * 3 + 1]) * FLAT,
        f.base[i * 3 + 2] * (1 - FLAT));
    }
    p.needsUpdate = true;
    f.mesh.geometry.computeVertexNormals();
  }
  for (const cb of FLATCHBS) cb(FLAT);
}


// ---------------- paint ----------------
// Patch = a set of triangles. 'faces' buckets by rounded face normal;
// [u,v] tiles the uv domain into a grid of cells. Painting is groups +
// a material array — no extra meshes, wireframe overlays unaffected.
const PALETTE_COLORS = ["#93c5fd","#f9a8d4","#86efac","#fde68a","#fca5a5","#c4b5fd","#67e8f9","#fbbf24"];
let PAINTING = false;
let paintColor = PALETTE_COLORS[0];
const PAINTABLES = [];
const ray = new THREE.Raycaster();

function paintable(mesh, spec) {
  const geo = mesh.geometry;
  const pos = geo.attributes.position;
  const uvA = geo.attributes.uv;
  const index = geo.index;
  const nTri = index ? index.count / 3 : pos.count / 3;
  const patchOf = new Array(nTri);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const va = new THREE.Vector3(), vb = new THREE.Vector3();
  for (let t = 0; t < nTri; t++) {
    const i0 = index ? index.getX(3 * t) : 3 * t;
    const i1 = index ? index.getX(3 * t + 1) : 3 * t + 1;
    const i2 = index ? index.getX(3 * t + 2) : 3 * t + 2;
    let key;
    if (spec === 'faces') {
      a.fromBufferAttribute(pos, i0);
      b.fromBufferAttribute(pos, i1);
      c.fromBufferAttribute(pos, i2);
      const n = va.subVectors(b, a).cross(vb.subVectors(c, a)).normalize();
      key = 'f' + n.x.toFixed(2) + ',' + n.y.toFixed(2) + ',' + n.z.toFixed(2);
    } else {
      let u = 0, v = 0;
      for (const i of [i0, i1, i2]) { u += uvA.getX(i); v += uvA.getY(i); }
      u /= 3; v /= 3;
      key = Math.min(spec[0] - 1, Math.floor(u * spec[0])) + ':' +
            Math.min(spec[1] - 1, Math.floor(v * spec[1]));
    }
    patchOf[t] = key;
  }
  PAINTABLES.push({ mesh, patchOf, painted: new Map(), base: mesh.material });
}

function applyPaint(entry) {
  const geo = entry.mesh.geometry;
  const mats = [entry.base];
  const colorIdx = new Map();
  for (const col of entry.painted.values()) {
    if (!colorIdx.has(col)) {
      colorIdx.set(col, mats.length);
      const m = entry.base.clone();
      m.color = new THREE.Color(col);
      if (m.transparent) m.opacity = Math.max(m.opacity, 0.85);
      if (typeof SLICECLIP !== 'undefined' && SLICECLIP) m.clippingPlanes = SLICECLIP;
      mats.push(m);
    }
  }
  entry.mesh.material = mats;
  geo.clearGroups();
  // Groups need contiguous runs — one per run of equal material index.
  const mi = entry.patchOf.map((key) =>
    entry.painted.has(key) ? colorIdx.get(entry.painted.get(key)) : 0);
  let s = 0;
  for (let t = 1; t <= mi.length; t++) {
    if (t === mi.length || mi[t] !== mi[s]) {
      geo.addGroup(s * 3, (t - s) * 3, mi[s]);
      s = t;
    }
  }
}

function inScene(o) {
  while (o) { if (o === scene) return true; o = o.parent; }
  return false;
}

let downXY = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downXY = [e.clientX, e.clientY];
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!PAINTING || !downXY) return;
  const dx = e.clientX - downXY[0], dy = e.clientY - downXY[1];
  downXY = null;
  if (dx * dx + dy * dy > 16) return;      // a drag is orbit, not a click
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(
    ((e.clientX - r.left) / r.width) * 2 - 1,
    -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hits = ray.intersectObjects(
    PAINTABLES.filter((p) => inScene(p.mesh)).map((p) => p.mesh), false);
  if (!hits.length || hits[0].faceIndex === undefined) return;
  const entry = PAINTABLES.find((p) => p.mesh === hits[0].object);
  const key = entry.patchOf[hits[0].faceIndex];
  if (key === undefined) return;
  if (paintColor === null) entry.painted.delete(key);
  else entry.painted.set(key, paintColor);
  applyPaint(entry);
});

// Swatch palette — shown only in paint mode.
const paletteEl = document.getElementById('palette');
function addSwatch(col) {
  const b = document.createElement('button');
  b.style.background = col;
  b.title = col;
  b.addEventListener('click', () => {
    paintColor = col;
    [...paletteEl.children].forEach((x) => x.classList.toggle('on', x === b));
  });
  paletteEl.append(b);
  return b;
}
PALETTE_COLORS.forEach(addSwatch);
const erase = document.createElement('button');
erase.className = 'erase';
erase.title = 'Erase patch color';
erase.addEventListener('click', () => {
  paintColor = null;
  [...paletteEl.children].forEach((x) => x.classList.toggle('on', x === erase));
});
paletteEl.append(erase);
const reset = document.createElement('button');
reset.className = 'reset';
reset.textContent = 'reset';
reset.addEventListener('click', () => {
  for (const p of PAINTABLES) { p.painted.clear(); applyPaint(p); }
});
paletteEl.append(reset);
paletteEl.children[0].classList.add('on');


// ---------- net unfold ----------
const vk = (v) => v.x.toFixed(3) + ',' + v.y.toFixed(3) + ',' + v.z.toFixed(3);

// Bucket a geometry's triangles into coplanar faces via rounded normals —
// works for every polyhedron regardless of how it was triangulated.
function polyFaces(geo) {
  const pos = geo.attributes.position, idx = geo.index;
  const n = idx ? idx.count / 3 : pos.count / 3;
  const map = new Map();
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for (let t = 0; t < n; t++) {
    const i0 = idx ? idx.getX(3 * t) : 3 * t;
    const i1 = idx ? idx.getX(3 * t + 1) : 3 * t + 1;
    const i2 = idx ? idx.getX(3 * t + 2) : 3 * t + 2;
    a.fromBufferAttribute(pos, i0);
    b.fromBufferAttribute(pos, i1);
    c.fromBufferAttribute(pos, i2);
    const nrm = new THREE.Vector3().subVectors(b, a)
      .cross(new THREE.Vector3().subVectors(c, a)).normalize();
    const key = vk(nrm);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push([a.clone(), b.clone(), c.clone()]);
  }
  return [...map.values()];
}

// Face boundary: edges used by exactly one triangle, walked into a loop.
function boundaryPts(F, i) {
  const count = new Map(), store = new Map();
  for (const t of F[i].triIdx) {
    for (const [s, e] of [[t[0], t[1]], [t[1], t[2]], [t[2], t[0]]]) {
      const k = Math.min(s, e) + '-' + Math.max(s, e);
      count.set(k, (count.get(k) || 0) + 1);
      if (!store.has(k)) store.set(k, [s, e]);
    }
  }
  const nxt = new Map();
  for (const [k, c] of count) {
    if (c !== 1) continue;
    const [s, e] = store.get(k);
    (nxt.get(s) || nxt.set(s, []).get(s)).push(e);
    (nxt.get(e) || nxt.set(e, []).get(e)).push(s);
  }
  const start = [...nxt.keys()][0];
  const pts = [];
  let cur = start, prev = -1;
  do {
    pts.push(F[i].pts[cur]);
    const nx = nxt.get(cur).find((x) => x !== prev);
    prev = cur;
    cur = nx;
  } while (cur !== start && cur !== undefined);
  return pts;
}

// Signed hinge angle rotating child normal onto parent normal about the
// shared-edge axis.
function hingePhi(F, f, c, axis) {
  return Math.atan2(
    axis.dot(new THREE.Vector3().crossVectors(F[c].nrm, F[f].nrm)),
    F[c].nrm.dot(F[f].nrm));
}

// One spanning tree. rand=false -> plain BFS from face 0 (deterministic);
// rand=true -> random root + random frontier-edge pick (randomized Prim).
function makeTree(F, adj, rand) {
  const parent = new Array(F.length).fill(-1);
  const hingeOf = new Array(F.length);
  const root = rand ? Math.floor(Math.random() * F.length) : 0;
  parent[root] = -2;
  const order = [root];
  if (rand) {
    let frontier = adj[root].slice();
    while (frontier.length) {
      const k = Math.floor(Math.random() * frontier.length);
      const a = frontier.splice(k, 1)[0];
      if (parent[a.j] !== -1) continue;
      parent[a.j] = a.from;
      hingeOf[a.j] = a;
      order.push(a.j);
      for (const b of adj[a.j]) if (parent[b.j] === -1) frontier.push(b);
    }
  } else {
    const queue = [root];
    while (queue.length) {
      const f = queue.shift();
      for (const a of adj[f]) {
        if (parent[a.j] !== -1) continue;
        parent[a.j] = f;
        hingeOf[a.j] = a;
        order.push(a.j);
        queue.push(a.j);
      }
    }
  }
  return { root, parent, hingeOf, order };
}

// Unfold the tree to its final flat layout; return each face's boundary
// polygon projected onto the root face's plane as [x, y].
function flatPolys(F, tree) {
  const { root, parent, hingeOf, order } = tree;
  const M = new Array(F.length);
  M[root] = new THREE.Matrix4();
  for (let k = 1; k < order.length; k++) {
    const c = order[k], f = parent[c], a = hingeOf[c];
    const h0 = a.e0.clone().applyMatrix4(M[f]);
    const h1 = a.e1.clone().applyMatrix4(M[f]);
    const axis = h1.clone().sub(h0).normalize();
    const phi = hingePhi(F, f, c, axis);
    M[c] = new THREE.Matrix4().makeTranslation(h0.x, h0.y, h0.z)
      .multiply(new THREE.Matrix4().makeRotationAxis(axis, phi))
      .multiply(new THREE.Matrix4().makeTranslation(-h0.x, -h0.y, -h0.z))
      .multiply(M[f].clone());
  }
  // 2D basis of the root face's flat plane.
  const n = F[root].nrm.clone();
  const u = F[root].pts[1].clone().sub(F[root].pts[0]).normalize();
  const v = new THREE.Vector3().crossVectors(n, u);
  const o = new THREE.Vector3();
  for (const p of F[root].pts) o.add(p);
  o.divideScalar(F[root].pts.length).applyMatrix4(M[root]);
  const tmp = new THREE.Vector3();
  return order.map((i) =>
    boundaryPts(F, i).map((p) => {
      tmp.copy(p).applyMatrix4(M[i]).sub(o);
      return [tmp.dot(u), tmp.dot(v)];
    }));
}

// SAT overlap for convex polygons — touching edges don't count.
function polyOverlap(a, b) {
  for (const poly of [a, b]) {
    for (let i = 0; i < poly.length; i++) {
      const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length];
      const nx = -(y2 - y1), ny = x2 - x1;
      let aMin = Infinity, aMax = -Infinity, bMin = Infinity, bMax = -Infinity;
      for (const [x, y] of a) {
        const d = x * nx + y * ny;
        if (d < aMin) aMin = d;
        if (d > aMax) aMax = d;
      }
      for (const [x, y] of b) {
        const d = x * nx + y * ny;
        if (d < bMin) bMin = d;
        if (d > bMax) bMax = d;
      }
      if (aMax <= bMin + 1e-4 || bMax <= aMin + 1e-4) return false;
    }
  }
  return true;
}

function overlapScore(polys) {
  let s = 0;
  for (let i = 0; i < polys.length; i++)
    for (let j = i + 1; j < polys.length; j++)
      if (polyOverlap(polys[i], polys[j])) s++;
  return s;
}

// Try trees until one's flat layout doesn't self-overlap; fall back to
// the least-overlapping if no perfect net turns up in the tries.
function pickNet(F, adj) {
  let best = null, bestScore = Infinity;
  for (let t = 0; t < 80; t++) {
    const tree = makeTree(F, adj, t > 0);
    if (tree.order.length < F.length) continue;   // disconnected guard
    const score = overlapScore(flatPolys(F, tree));
    if (score < bestScore) { best = tree; bestScore = score; }
    if (score === 0) break;
  }
  return best;
}

function unfoldNet(faces, material, edgeColor) {
  const edgeMat = new THREE.LineBasicMaterial({ color: edgeColor });

  // Per-face: deduped points, triangle indices into them, face normal.
  const F = faces.map((tris) => {
    const pts = [], seen = new Map();
    const triIdx = tris.map((t) => t.map((v) => {
      const k = vk(v);
      if (!seen.has(k)) { seen.set(k, pts.length); pts.push(v.clone()); }
      return seen.get(k);
    }));
    const nrm = new THREE.Vector3().subVectors(tris[0][1], tris[0][0])
      .cross(new THREE.Vector3().subVectors(tris[0][2], tris[0][0])).normalize();
    return { pts, triIdx, nrm };
  });

  // Adjacency: two faces sharing >= 2 coincident points share an edge.
  const adj = F.map(() => []);
  for (let i = 0; i < F.length; i++) {
    for (let j = i + 1; j < F.length; j++) {
      const shared = F[i].pts.filter((p) =>
        F[j].pts.some((q) => vk(q) === vk(p)));
      if (shared.length >= 2) {
        adj[i].push({ j, from: i, e0: shared[0], e1: shared[1] });
        adj[j].push({ j: i, from: j, e0: shared[0], e1: shared[1] });
      }
    }
  }

  const { root, parent, hingeOf, order } = pickNet(F, adj);

  function faceMesh(i) {
    const verts = [];
    for (const t of F[i].triIdx) {
      for (const vi of t) {
        const p = F[i].pts[vi];
        verts.push(p.x, p.y, p.z);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
    g.computeVertexNormals();
    return new THREE.Mesh(g, material);
  }
  const edgeLoop = (i) => new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(
      boundaryPts(F, i).map((p) => p.clone())), edgeMat);

  // Hierarchy: node(face) -> hinge(child edge) -> node(child).
  // A node's local frame is "folded world minus its own hinge point", so
  // descendant hinge positions are stored as (worldEdge - parentOrigin).
  const group = new THREE.Group();
  const nodes = new Array(F.length);
  const hinges = [];                    // { g, axis, phi }
  const meshes = new Array(F.length);
  const origin = new Array(F.length).fill(null);

  nodes[root] = new THREE.Group();
  group.add(nodes[root]);
  meshes[root] = faceMesh(root);
  nodes[root].add(meshes[root], edgeLoop(root));
  origin[root] = new THREE.Vector3();

  for (let k = 1; k < order.length; k++) {
    const c = order[k], f = parent[c], a = hingeOf[c];
    const axis = new THREE.Vector3().subVectors(a.e1, a.e0).normalize();
    const phi = hingePhi(F, f, c, axis);
    const hinge = new THREE.Group();
    hinge.position.copy(a.e0).sub(origin[f]);
    nodes[f].add(hinge);
    const node = new THREE.Group();
    hinge.add(node);
    meshes[c] = faceMesh(c);
    meshes[c].position.copy(a.e0).negate();
    node.add(meshes[c]);
    const el = edgeLoop(c);
    el.position.copy(a.e0).negate();
    node.add(el);
    nodes[c] = node;
    origin[c] = a.e0;
    hinges.push({ g: hinge, axis, phi });
  }

  // Slerp the whole group so the root face lands flat on +Y when open.
  const qFlat = new THREE.Quaternion().setFromUnitVectors(
    F[root].nrm, new THREE.Vector3(0, 1, 0));
  const qId = new THREE.Quaternion();

  function setOpen(t) {
    for (const h of hinges) {
      h.g.quaternion.setFromAxisAngle(h.axis, t * h.phi);
    }
    group.quaternion.slerpQuaternions(qId, qFlat, t);
  }
  return { group, setOpen, meshes };
}


// ---------------- slice ----------------
// A world-space plane cuts every registered mesh; the section is drawn
// as thick segments and projected into a 2D inset. The 'cut' pick clips
// either side via localClipping — the classic look-inside-the-solid.
renderer.localClippingEnabled = true;
const SLICABLES = [];
const sliceable = (m) => SLICABLES.push(m);
const clearSlice = () => { SLICABLES.length = 0; };
let SLICECLIP = null;                     // null = show both sides

let sliceTilt = 35, sliceOffset = 0.35, sliceSpin = 0;
const sliceN = new THREE.Vector3(), sliceP = new THREE.Vector3();
const cutPlane = new THREE.Plane();
const clipAbove = new THREE.Plane(), clipBelow = new THREE.Plane();

// Plane visuals live in a group — a gizmo can drive its pose directly
// (circle faces local +Z, arrow points +Z; the group pose IS the plane).
const planeGroup = new THREE.Group();
scene.add(planeGroup);
const planeMesh = new THREE.Mesh(
  new THREE.CircleGeometry(2.1, 48),
  new THREE.MeshBasicMaterial({ color: 0x4f46e5, transparent: true,
    opacity: 0.14, side: THREE.DoubleSide, depthWrite: false }));
planeGroup.add(planeMesh);
const sliceArrow = new THREE.ArrowHelper(
  new THREE.Vector3(0, 0, 1), new THREE.Vector3(), 0.55, 0xe11d48, 0.16, 0.09);
planeGroup.add(sliceArrow);
const sliceLine = new THREE.LineSegments(
  new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({ color: 0xe11d48 }));
scene.add(sliceLine);

const sliceRead = document.getElementById('sliceread');
const sliceCv = document.getElementById('sliceview');
const sliceCtx = sliceCv.getContext('2d');
let _sliceInfo = '';
const setSliceInfo = (t) => { _sliceInfo = t; };

const _sliceInScene = (o) => {
  while (o) { if (o === scene) return true; o = o.parent; }
  return false;
};

// The whole tool is hidden until the toolbar button turns it on.
let sliceOn = false, sliceCut = 'full';
const sliceRows = [
  param('tilt °', 0, 180, sliceTilt, 1, (v) => (sliceTilt = v)),
  param('offset', -1.4, 1.4, sliceOffset, 0.02, (v) => (sliceOffset = v)),
  param('spin °', 0, 360, sliceSpin, 1, (v) => (sliceSpin = v)),
  pick('cut', ['full', 'above', 'below'], (v) => { sliceCut = v; applyCut(); }),
];
const sliceBtnEl = document.getElementById('slicebtn');
const grabBtnEl = document.getElementById('grabbtn');
let PLANE_GRAB = false;
function setGrab(on) {
  // Early return keeps the eval-time setSlice(false) away from curMode —
  // it's a let in gizmoJs emitted after this block (typeof on a let in
  // TDZ throws, it doesn't return 'undefined').
  if (on === PLANE_GRAB) return;
  PLANE_GRAB = on;
  grabBtnEl.classList.toggle('on', on);
  // Re-run the current mode so the gizmo jumps between shape and plane.
  setMode(curMode);
}
grabBtnEl.addEventListener('click', () => setGrab(!PLANE_GRAB));
function applyCut() {
  SLICECLIP = !sliceOn || sliceCut === 'full' ? null
    : sliceCut === 'above' ? clipAbove : clipBelow;
}
function setSlice(on) {
  sliceOn = on;
  sliceBtnEl.classList.toggle('on', on);
  sliceBtnEl.title = on ? 'Hide slice plane (x)' : 'Slice plane (x)';
  planeGroup.visible = sliceLine.visible = on;
  sliceRead.style.display = sliceCv.style.display = on ? '' : 'none';
  grabBtnEl.style.display = on ? '' : 'none';
  for (const r of sliceRows) r.style.display = on ? '' : 'none';
  if (!on) setGrab(false);
  applyCut();
}
sliceBtnEl.addEventListener('click', () => setSlice(!sliceOn));
addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'x' && !e.repeat) setSlice(!sliceOn);
});
setSlice(false);
// Scenario: open the slice tool on load (tilt/offset/spin/cut seed
// through the generic param/pick init above).
if (SCENARIO_PARAMS.slice) setSlice(true);

// Write a param row's input + readout when the gizmo drives the values.
const rowVal = (row, v) => {
  const inp = row.querySelector('input'), out = row.querySelector('.pval');
  if (inp) inp.value = v;
  if (out) out.textContent = Math.round(v * 100) / 100;
};

const _sa = new THREE.Vector3(), _sb = new THREE.Vector3(),
      _sc = new THREE.Vector3(), _sd = new THREE.Vector3();

tick(() => {
  if (!sliceOn) return;
  if (!PLANE_GRAB) {
    // Sliders drive the pose.
    const th = (sliceTilt * Math.PI) / 180, ph = (sliceSpin * Math.PI) / 180;
    sliceN.set(Math.sin(th) * Math.cos(ph), Math.cos(th),
               Math.sin(th) * Math.sin(ph));
    planeGroup.position.copy(sliceN).multiplyScalar(sliceOffset);
    planeGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), sliceN);
  }
  // The group pose is the plane — read normal + a point from it.
  sliceN.set(0, 0, 1).applyQuaternion(planeGroup.quaternion);
  sliceP.copy(planeGroup.position);
  cutPlane.setFromNormalAndCoplanarPoint(sliceN, sliceP);
  const _sOff = sliceN.dot(sliceP);
  clipAbove.set(sliceN, -_sOff);
  clipBelow.copy(clipAbove).negate();
  if (PLANE_GRAB) {
    // Gizmo drives the pose — reflect it back into the sliders.
    sliceTilt = Math.round(
      Math.acos(Math.min(1, Math.max(-1, sliceN.y))) * 180 / Math.PI);
    sliceSpin = Math.round(
      (Math.atan2(sliceN.z, sliceN.x) * 180 / Math.PI + 360) % 360);
    sliceOffset = Math.round(_sOff * 100) / 100;
    rowVal(sliceRows[0], sliceTilt);
    rowVal(sliceRows[1], sliceOffset);
    rowVal(sliceRows[2], sliceSpin);
  }

  // Plane x triangles -> world-space section segments.
  const segs = [];
  for (const m of SLICABLES) {
    if (!_sliceInScene(m)) continue;
    m.updateWorldMatrix(true, false);
    const pos = m.geometry.attributes.position, idx = m.geometry.index;
    const nT = idx ? idx.count / 3 : pos.count / 3;
    for (let t = 0; t < nT; t++) {
      const i0 = idx ? idx.getX(3 * t) : 3 * t;
      const i1 = idx ? idx.getX(3 * t + 1) : 3 * t + 1;
      const i2 = idx ? idx.getX(3 * t + 2) : 3 * t + 2;
      _sa.fromBufferAttribute(pos, i0).applyMatrix4(m.matrixWorld);
      _sb.fromBufferAttribute(pos, i1).applyMatrix4(m.matrixWorld);
      _sc.fromBufferAttribute(pos, i2).applyMatrix4(m.matrixWorld);
      const d0 = cutPlane.distanceToPoint(_sa),
            d1 = cutPlane.distanceToPoint(_sb),
            d2 = cutPlane.distanceToPoint(_sc);
      for (const [p0, dd0, p1, dd1] of [
        [_sa, d0, _sb, d1], [_sb, d1, _sc, d2], [_sc, d2, _sa, d0]]) {
        if ((dd0 > 0) === (dd1 > 0) || Math.abs(dd0 - dd1) < 1e-9) continue;
        const tt = dd0 / (dd0 - dd1);
        segs.push(p0.x + (p1.x - p0.x) * tt,
                  p0.y + (p1.y - p0.y) * tt,
                  p0.z + (p1.z - p0.z) * tt);
      }
    }
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    for (const mt of mats) mt.clippingPlanes = SLICECLIP;
  }
  sliceLine.geometry.setAttribute('position',
    new THREE.BufferAttribute(new Float32Array(segs), 3));

  // 2D inset — project the section onto the plane's own basis.
  const u = Math.abs(sliceN.y) > 0.99
    ? new THREE.Vector3(1, 0, 0)
    : new THREE.Vector3(0, 1, 0).cross(sliceN).normalize();
  const v = new THREE.Vector3().crossVectors(sliceN, u);
  const pts = [];
  let cx = 0, cy = 0;
  for (let i = 0; i < segs.length; i += 3) {
    _sd.set(segs[i], segs[i + 1], segs[i + 2]);
    const x = _sd.dot(u), y = _sd.dot(v);
    pts.push(x, y); cx += x; cy += y;
  }
  const n = pts.length / 2;
  sliceCtx.clearRect(0, 0, sliceCv.width, sliceCv.height);
  if (n) {
    cx /= n; cy /= n;
    const s = 26, hw = sliceCv.width / 2, hh = sliceCv.height / 2;
    sliceCtx.strokeStyle = '#cbd5e1';
    sliceCtx.lineWidth = 1;
    sliceCtx.beginPath();
    sliceCtx.moveTo(0, hh); sliceCtx.lineTo(sliceCv.width, hh);
    sliceCtx.moveTo(hw, 0); sliceCtx.lineTo(hw, sliceCv.height);
    sliceCtx.stroke();
    sliceCtx.strokeStyle = '#e11d48';
    sliceCtx.lineWidth = 1.5;
    sliceCtx.beginPath();
    for (let i = 0; i < n; i += 2) {
      sliceCtx.moveTo(hw + (pts[2 * i] - cx) * s,
                      hh - (pts[2 * i + 1] - cy) * s);
      sliceCtx.lineTo(hw + (pts[2 * i + 2] - cx) * s,
                      hh - (pts[2 * i + 3] - cy) * s);
    }
    sliceCtx.stroke();
  }
  sliceRead.innerHTML =
    '<div class="sr-main">θ ' + sliceTilt + '° · d ' +
    (sliceOffset >= 0 ? '+' : '') + sliceOffset.toFixed(2) + '</div>' +
    (_sliceInfo ? '<div class="sr-info">' + _sliceInfo + '</div>' : '');
});



// ---------------- flatten toggle ----------------
// FLATTGT is the target; the RAF loop eases FLAT toward it.
const flatBtnEl = document.getElementById('flatbtn');
function toggleFlat() {
  FLATTGT = FLATTGT ? 0 : 1;
  flatBtnEl.classList.toggle('on', FLATTGT === 1);
  flatBtnEl.title = FLATTGT ? 'Refold (f)' : 'Flatten / unfold (f)';
}
flatBtnEl.addEventListener('click', toggleFlat);
addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'f' && !e.repeat) toggleFlat();
});
if (SCENARIO_PARAMS.flat) toggleFlat();   // scenario: start unfolded

// ---------------- sim ----------------

// Cube first — it's the default when no solid param is given.
const DEFS = {
  Cube: () => new THREE.BoxGeometry(1.7, 1.7, 1.7),
  Tetrahedron: () => new THREE.TetrahedronGeometry(1.3),
  Octahedron: () => new THREE.OctahedronGeometry(1.3),
  Dodecahedron: () => new THREE.DodecahedronGeometry(1.15),
  Icosahedron: () => new THREE.IcosahedronGeometry(1.25),
};
const mat = new THREE.MeshStandardMaterial({
  color: 0x93c5fd, metalness: 0.05, roughness: 0.6,
  transparent: true, opacity: 0.7, side: THREE.DoubleSide });
let net = null;

function show(name) {
  if (net) {
    shape.remove(net.group);
    net.group.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (Array.isArray(o.material)) o.material.forEach((m) => m.dispose());
    });
  }
  clearSlice();
  net = unfoldNet(polyFaces(DEFS[name]()), mat, 0x1e3a8a);
  shape.add(net.group);
  net.meshes.forEach((m) => { paintable(m, 'faces'); sliceable(m); });
  net.setOpen(FLAT);   // re-apply current flatten amount on the new solid
}
onFlatten((t) => { if (net) net.setOpen(t); });

pick('solid', Object.keys(DEFS), show);


// ---------------- transform gizmo ----------------
// r169+ API: TransformControls extends Controls; the visible gizmo is a
// separate helper added to the scene. Starts detached — 'move' reveals it.
const gizmo = new TransformControls(camera, renderer.domElement);
scene.add(gizmo.getHelper());
gizmo.size = 0.8;
gizmo.addEventListener('dragging-changed', (e) => {
  controls.enabled = !e.value;   // never fight OrbitControls for a drag
});
const modeButtons = [...document.querySelectorAll('#modes button[data-m]')];
let curMode = 'orbit';
function setMode(m) {
  curMode = m;
  modeButtons.forEach((b) => b.classList.toggle('on', b.dataset.m === m));
  gizmo.detach();
  if (m === 'translate' || m === 'rotate' || m === 'scale') {
    // Grab mode retargets the gizmo at the slice plane (scale stays
    // on the shape — scaling a plane is meaningless).
    const target =
      typeof PLANE_GRAB !== 'undefined' && PLANE_GRAB && m !== 'scale'
        ? planeGroup : shape;
    gizmo.attach(target);
    gizmo.setMode(m);
  }
  if (typeof PAINTING !== 'undefined') {
    PAINTING = m === 'paint';
    document.getElementById('palette').classList.toggle('show', PAINTING);
  }
}
modeButtons.forEach((b) => b.addEventListener('click', () => setMode(b.dataset.m)));
const KEYS = { v: 'orbit', g: 'translate', r: 'rotate', s: 'scale', p: 'paint' };
addEventListener('keydown', (e) => {
  const m = KEYS[e.key.toLowerCase()];
  if (m) setMode(m);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  if (FLAT !== FLATTGT) {
    FLAT += (FLATTGT - FLAT) * Math.min(1, dt * 4.5);
    if (Math.abs(FLATTGT - FLAT) < 0.002) FLAT = FLATTGT;
  }
  for (const f of TICKS) f(t);
  applyFlatten();
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
