<!DOCTYPE html>
<html>
<head><script>
addEventListener('error', function(e){
  try{
    var ov=document.getElementById('overlay'); if(!ov) return;
    ov.className='err';
    var m=ov.querySelector('.msg');
    var t=(e&&e.message)||'Script failed to load';
    var f=(e&&e.filename)||'';
    if(m) m.textContent=f?t+' \u2014 '+f:t;
    var s=ov.querySelector('.spin'); if(s) s.style.display='none';
    ov.style.display='flex';
  }catch(_){}
}, true);
addEventListener('unhandledrejection', function(e){
  try{
    var ov=document.getElementById('overlay'); if(!ov) return;
    ov.className='err';
    var m=ov.querySelector('.msg');
    var r=e&&e.reason;
    var t=(r&&(r.message||r))||'Request failed';
    if(m) m.textContent=String(t);
    var s=ov.querySelector('.spin'); if(s) s.style.display='none';
    ov.style.display='flex';
  }catch(_){}
});
</script>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: ui-monospace, monospace; background: #f8fafc; color: #0f172a;
         display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { padding: 8px 12px; font-size: 12px; font-weight: 700; color: #4f46e5;
           border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px; }
  #status { margin-left: auto; font-size: 10px; color: #64748b; font-weight: 400; }
  #stage { flex: 1; position: relative; display: flex; }
  .half { flex: 1; position: relative; }
  canvas { position: absolute; inset: 0; }
  .lab { position: absolute; top: 6px; left: 8px; font-size: 10px; color: #94a3b8; }
  #controls { padding: 8px 12px; border-top: 1px solid #e2e8f0; background: #fff;
              display: flex; align-items: center; gap: 14px; font-size: 11px; flex-wrap: wrap; }
  button { background: #4f46e5; color: #fff; border: 0; border-radius: 6px;
           padding: 4px 12px; font-size: 11px; cursor: pointer; font-family: inherit; }
  button.ghost { background: #e2e8f0; color: #334155; }
  label { display: flex; align-items: center; gap: 6px; color: #475569; }
  input[type=range] { width: 80px; }
  .val { color: #4f46e5; font-weight: 700; min-width: 30px; }
</style>
</head>
<body>
<header>RC Circuit — Capacitor Charging<span id="status">ready</span></header>
<div id="stage">
  <div class="half"><span class="lab">i(t) = V/R · e^(−t/τ)</span><canvas id="cvI"></canvas></div>
  <div class="half"><span class="lab">v_C(t) = V(1 − e^(−t/τ))</span><canvas id="cvV"></canvas></div>
</div>
<div id="controls">
  <button id="play">Charge</button>
  <button id="reset" class="ghost">Discharge</button>
  <label>V <input id="V" type="range" min="1" max="24" value="10"><span class="val" id="VV"></span></label>
  <label>R <input id="R" type="range" min="1" max="100" value="10"><span class="val" id="RV"></span></label>
  <label>C <input id="C" type="range" min="1" max="20" value="5"><span class="val" id="CV"></span></label>
</div>
<script>
const PARAMS = __PARAMS__;
const P = {
  V: Number(PARAMS.V) > 0 ? Number(PARAMS.V) : 10,
  R: Number(PARAMS.R) > 0 ? Number(PARAMS.R) : 10,
  C: Number(PARAMS.C) > 0 ? Number(PARAMS.C) / 10 : 0.5,
};

const cvI = document.getElementById('cvI'), ctxI = cvI.getContext('2d');
const cvV = document.getElementById('cvV'), ctxV = cvV.getContext('2d');
const status = document.getElementById('status');
let t = 0, playing = false, raf = null, last = 0;

const tau = () => P.R * P.C;
const iAt = (t) => (P.V / P.R) * Math.exp(-t / tau());
const vAt = (t) => P.V * (1 - Math.exp(-t / tau()));
const tEnd = () => 5 * tau(); // ~99.3% charged

function plot(ctx, cv, yMax, fn, color) {
  const w = cv.width, h = cv.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#e2e8f0';
  for (let gx = 10; gx < w; gx += 30) for (let gy = 10; gy < h; gy += 30) ctx.fillRect(gx, gy, 1.5, 1.5);
  const T = tEnd(), sx = (w - 50) / T, sy = (h - 50) / yMax;
  const ox = 34, oy = h - 30;
  // axes
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(w, oy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, h); ctx.stroke();
  // τ marker
  ctx.strokeStyle = '#f59e0b'; ctx.setLineDash([3, 3]); ctx.beginPath();
  ctx.moveTo(ox + tau() * sx, 0); ctx.lineTo(ox + tau() * sx, h); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#f59e0b'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
  ctx.fillText('τ', ox + tau() * sx, oy + 11);
  // full curve dashed + flown solid
  ctx.strokeStyle = '#c7d2fe'; ctx.setLineDash([4, 4]); ctx.beginPath();
  for (let tt = 0; tt <= T; tt += T / 200) ctx.lineTo(ox + tt * sx, oy - fn(tt) * sy);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  for (let tt = 0; tt <= t; tt += T / 400) ctx.lineTo(ox + tt * sx, oy - fn(tt) * sy);
  ctx.stroke();
  // marker
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(ox + t * sx, oy - fn(t) * sy, 5, 0, 7); ctx.fill();
}

function draw() {
  plot(ctxI, cvI, P.V / P.R * 1.1, iAt, '#0ea5e9');
  plot(ctxV, cvV, P.V * 1.15, vAt, '#4f46e5');
  const pct = (vAt(t) / P.V * 100).toFixed(1);
  status.textContent = t >= tEnd()
    ? `charged — v_C=${vAt(t).toFixed(1)}V (τ=${tau().toFixed(2)}s)`
    : `t=${t.toFixed(2)}s  v_C=${vAt(t).toFixed(2)}V (${pct}%)  i=${iAt(t).toFixed(2)}A  τ=${tau().toFixed(2)}s`;
}

function frame(ts) {
  if (!playing) return;
  const dt = Math.min((ts - last) / 1000, 0.05); last = ts;
  t += dt * tau() / 2; // scale playback to τ so it never drags
  if (t >= tEnd()) { t = tEnd(); playing = false;
    document.getElementById('play').textContent = 'Charge'; }
  draw();
  if (playing) raf = requestAnimationFrame(frame);
}
function reset() { playing = false; cancelAnimationFrame(raf); t = 0;
  document.getElementById('play').textContent = 'Charge'; draw(); }
function resize() {
  document.querySelectorAll('.half').forEach((el, idx) => {
    const r = el.getBoundingClientRect();
    const cv = idx === 0 ? cvI : cvV;
    cv.width = r.width; cv.height = r.height;
  });
  draw();
}

document.getElementById('play').onclick = () => {
  if (playing) { playing = false; document.getElementById('play').textContent = 'Charge'; return; }
  if (t >= tEnd()) t = 0;
  playing = true; last = performance.now();
  document.getElementById('play').textContent = 'Pause';
  raf = requestAnimationFrame(frame);
};
document.getElementById('reset').onclick = reset;
function bind(id, key, scale, fmt) {
  const el = document.getElementById(id);
  el.value = Math.round(P[key] * scale);
  document.getElementById(id + 'V').textContent = fmt(P[key]);
  el.oninput = () => { P[key] = Number(el.value) / scale;
    document.getElementById(id + 'V').textContent = fmt(P[key]); reset(); };
}
bind('V', 'V', 1, (v) => v.toFixed(0) + 'V');
bind('R', 'R', 1, (v) => v.toFixed(0) + 'Ω');
bind('C', 'C', 10, (v) => v.toFixed(1) + 'F');
window.addEventListener('resize', resize);
reset(); resize();
</script>
</body>
</html>
