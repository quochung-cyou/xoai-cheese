<!DOCTYPE html>
<html>
<head><script>
addEventListener('error', function(e){
  try{
    var ov=document.getElementById('overlay'); if(!ov) return;
    ov.className='err';
    var m=ov.querySelector('.msg');
    var t=(e&&e.message)||'Script failed to load';
    var f=(e&&e.filename)||'';
    if(m) m.textContent=f?t+' \u2014 '+f:t;
    var s=ov.querySelector('.spin'); if(s) s.style.display='none';
    ov.style.display='flex';
  }catch(_){}
}, true);
addEventListener('unhandledrejection', function(e){
  try{
    var ov=document.getElementById('overlay'); if(!ov) return;
    ov.className='err';
    var m=ov.querySelector('.msg');
    var r=e&&e.reason;
    var t=(r&&(r.message||r))||'Request failed';
    if(m) m.textContent=String(t);
    var s=ov.querySelector('.spin'); if(s) s.style.display='none';
    ov.style.display='flex';
  }catch(_){}
});
</script>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: ui-monospace, monospace; background: #f8fafc; color: #0f172a;
         display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { padding: 8px 12px; font-size: 12px; font-weight: 700; color: #4f46e5;
           border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px; }
  #status { margin-left: auto; font-size: 10px; color: #64748b; font-weight: 400; }
  #stage { flex: 1; position: relative; }
  canvas { position: absolute; inset: 0; }
  #controls { padding: 8px 12px; border-top: 1px solid #e2e8f0; background: #fff;
              display: flex; align-items: center; gap: 14px; font-size: 11px; flex-wrap: wrap; }
  button { background: #4f46e5; color: #fff; border: 0; border-radius: 6px;
           padding: 4px 12px; font-size: 11px; cursor: pointer; font-family: inherit; }
  button.ghost { background: #e2e8f0; color: #334155; }
  label { display: flex; align-items: center; gap: 6px; color: #475569; }
  input[type=range] { width: 90px; }
  .val { color: #4f46e5; font-weight: 700; min-width: 34px; }
</style>
</head>
<body>
<header>Simple Pendulum<span id="status">ready</span></header>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="controls">
  <button id="play">Play</button>
  <button id="reset" class="ghost">Reset</button>
  <label>L (m) <input id="len" type="range" min="20" max="200" value="100"><span class="val" id="lenV"></span></label>
  <label>θ₀ (°) <input id="ang" type="range" min="5" max="80" value="20"><span class="val" id="angV"></span></label>
  <label>g <input id="g" type="range" min="16" max="250" value="98"><span class="val" id="gV"></span></label>
</div>
<script>
const PARAMS = __PARAMS__;
const P = {
  L: Number(PARAMS.length_m) > 0 ? Number(PARAMS.length_m) : 1.0,
  g: Number(PARAMS.gravity) > 0 ? Number(PARAMS.gravity) : 9.81,
  th0: (Number(PARAMS.angle_deg) || 20) * Math.PI / 180,
};

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const status = document.getElementById('status');
let th = P.th0, om = 0, playing = false, raf = null, t = 0, last = 0;
let px2m; // pixels per meter — fit 1.3 * L into viewport height

// Exact-ish integrator: small-angle RK4 on th'' = -(g/L) sin(th)
function deriv(th, om) { return [om, -(P.g / P.L) * Math.sin(th)]; }
function step(dt) {
  const [k1a, k1b] = deriv(th, om);
  const [k2a, k2b] = deriv(th + k1a * dt / 2, om + k1b * dt / 2);
  const [k3a, k3b] = deriv(th + k2a * dt / 2, om + k2b * dt / 2);
  const [k4a, k4b] = deriv(th + k3a * dt, om + k3b * dt);
  th += dt / 6 * (k1a + 2 * k2a + 2 * k3a + k4a);
  om += dt / 6 * (k1b + 2 * k2b + 2 * k3b + k4b);
}

function draw() {
  const w = cv.width, h = cv.height;
  ctx.clearRect(0, 0, w, h);
  px2m = (h * 0.62) / P.L;
  const px = w / 2, py = h * 0.12;
  const bx = px + Math.sin(th) * P.L * px2m;
  const by = py + Math.cos(th) * P.L * px2m;
  // grid dots
  ctx.fillStyle = '#e2e8f0';
  for (let gx = 20; gx < w; gx += 40) for (let gy = 20; gy < h; gy += 40) ctx.fillRect(gx, gy, 1.5, 1.5);
  // arc guide
  ctx.strokeStyle = '#c7d2fe'; ctx.setLineDash([4, 4]); ctx.beginPath();
  ctx.arc(px, py, P.L * px2m, Math.PI / 2 - P.th0, Math.PI / 2 + P.th0); ctx.stroke();
  ctx.setLineDash([]);
  // rod + bob + pivot
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(bx, by); ctx.stroke();
  ctx.fillStyle = '#4f46e5';
  ctx.beginPath(); ctx.arc(bx, by, 14, 0, 7); ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();
  // readouts
  const T = 2 * Math.PI * Math.sqrt(P.L / P.g);
  status.textContent = `t=${t.toFixed(1)}s  θ=${(th * 180 / Math.PI).toFixed(1)}°  T≈${T.toFixed(2)}s`;
}

function frame(ts) {
  if (!playing) return;
  const dt = Math.min((ts - last) / 1000, 0.05); last = ts;
  // substep for stability
  for (let i = 0; i < 4; i++) step(dt / 4);
  t += dt;
  draw();
  raf = requestAnimationFrame(frame);
}
function play() { playing = true; document.getElementById('play').textContent = 'Pause';
  last = performance.now(); raf = requestAnimationFrame(frame); }
function stop() { playing = false; document.getElementById('play').textContent = 'Play';
  cancelAnimationFrame(raf); }

function reset() { stop(); th = P.th0; om = 0; t = 0; draw(); }
function resize() {
  const r = document.getElementById('stage').getBoundingClientRect();
  cv.width = r.width; cv.height = r.height; draw();
}

document.getElementById('play').onclick = () => playing ? stop() : play();
document.getElementById('reset').onclick = reset;
function bind(id, key, scale, label, fmt) {
  const el = document.getElementById(id);
  el.value = Math.round(P[key] * scale);
  document.getElementById(id + 'V').textContent = fmt(P[key]);
  el.oninput = () => { P[key] = Number(el.value) / scale;
    document.getElementById(id + 'V').textContent = fmt(P[key]); reset(); };
}
bind('len', 'L', 100, 'L', (v) => v.toFixed(2));
bind('ang', 'th0', 180 / Math.PI * 1, 'θ', (v) => (v * 180 / Math.PI).toFixed(0) + '°');
bind('g', 'g', 10, 'g', (v) => v.toFixed(1));
window.addEventListener('resize', resize);
reset(); resize();
</script>
</body>
</html>
