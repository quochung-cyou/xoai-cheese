<!DOCTYPE html>
<html lang="vi">
<head><script>
(function(){
  var ov=function(){ return document.getElementById('overlay'); };
  var show=function(text){
    try{
      var o=ov(); if(!o) return;
      o.className='err';
      var m=o.querySelector('.msg');
      if(m) m.textContent=text;
      var s=o.querySelector('.spin'); if(s) s.style.display='none';
      o.style.display='flex';
    }catch(_){}
  };
  // Name the URL that failed. "Failed to fetch" alone identifies nothing —
  // the path is what points at the missing or mis-pathed asset.
  var detail=function(e){
    var r=e&&e.reason!==undefined?e.reason:(e||{});
    var msg=(r&&(r.message||r))||'Yêu cầu thất bại';
    msg=String(msg);
    if(r&&r.url&&msg.indexOf(r.url)<0) return msg+' — '+r.url;
    if(e&&e.filename) return msg+' — '+e.filename;
    return msg;
  };
  addEventListener('error',function(e){ show(detail(e)); },true);
  addEventListener('unhandledrejection',function(e){ show(detail(e)); });
})()
</script>

{
  "imports": {

<body>
<div id="stage"></div>
<div id="hud"><div id="title">Giải phẫu 3D</div></div>
<div id="tip"></div>
<div id="bar"></div>
<div id="status">đang tải…</div>
<div id="overlay"><div class="spin"></div><div class="msg">Đang tải mô hình giải phẫu…</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PARAMS = __PARAMS__;

const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const overlayMsg = overlay.querySelector('.msg');
const tipEl = document.getElementById('tip');
const bar = document.getElementById('bar');

const fail = (msg) => {
  overlay.classList.add('err');
  overlayMsg.textContent = msg;
  overlay.querySelector('.spin').style.display = 'none';
};

// human-atlas model-download.ts: máy chủ tĩnh có thể trả tệp .gz ở dạng
// thô hoặc đã được giải mã khi truyền — kiểm tra magic bytes rồi giải mã một lần.
async function fetchChunk(url, expectedBytes) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`tài nguyên ${url} -> ${res.status}`);
  const payload = await res.arrayBuffer();
  const sig = new Uint8Array(payload, 0, 2);
  const gz = sig[0] === 0x1f && sig[1] === 0x8b;
  const buf = gz && typeof DecompressionStream !== 'undefined'
    ? await new Response(
        new Blob([payload]).stream().pipeThrough(
          new DecompressionStream('gzip'))
      ).arrayBuffer()
    : payload;
  if (buf.byteLength !== expectedBytes)
    throw new Error('Một tệp dữ liệu giải phẫu bị thiếu hoặc không đầy đủ.');
  return buf;
}

async function main() {
  // ---------------- dữ liệu ----------------
  const data = await (await fetch(
    `/mb-assets/atlas/structures.json`)).json();
  const structures = data.structures || {};
  const systems = data.systems || {};
  const concepts = data.concepts || {};
  const conceptByName = {};
  for (const c of Object.values(concepts))
    conceptByName[(c.name || '').toLowerCase()] = c;
  const aliases = data.aliases || {};
  const colors = data.systemColors || {};
  const SYSTEM_ORDER = Object.keys(systems).sort((a, b) =>
    systems[b].length - systems[a].length);
  // Lớp bì (vỏ da) mặc định bị ẩn — nó che khuất mọi thứ.
  const DEFAULT_HIDDEN = new Set(['integumentary']);

  // ---------------- thiết lập three.js ----------------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf2f3f3);
  const camera = new THREE.PerspectiveCamera(
    34, stage.clientWidth / stage.clientHeight, 0.005, 100);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.085;
  controls.minDistance = 0.07;

  scene.add(new THREE.HemisphereLight(0xffffff, 0xa7acb2, 1.05));
  const key = new THREE.DirectionalLight(0xfffaf4, 2.3);
  key.position.set(-2, 4, 3);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xe9f0ff, 1.8);
  rim.position.set(2, 2, -3);
  scene.add(rim);

  new ResizeObserver(() => {
    camera.aspect = stage.clientWidth / stage.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(stage.clientWidth, stage.clientHeight);
  }).observe(stage);
  renderer.setSize(stage.clientWidth, stage.clientHeight);

  // ---------------- mô hình ----------------
  const systemMats = new Map();
  const matFor = (sys) => {
    if (!systemMats.has(sys)) {
      systemMats.set(sys, new THREE.MeshStandardMaterial({
        color: colors[sys] || '#aebbb8',
        metalness: 0.08, roughness: 0.53, side: THREE.DoubleSide,
      }));
    }
    return systemMats.get(sys);
  };

  const parts = new Map(); // partId -> {mesh, part}
  const chunks = data.chunks || [];
  let loaded = 0;

  async function loadChunk(ci) {
    const chunk = chunks[ci];
    const buffer = await fetchChunk(
      `/mb-assets/${chunk.url}`, chunk.bytes);
    for (const p of data.parts) {
      if (p.chunk !== ci) continue;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(
        new Float32Array(buffer, p.positions, p.vertexCount * 3), 3));
      g.setAttribute('normal', new THREE.BufferAttribute(
        new Int16Array(buffer, p.normals, p.vertexCount * 3), 3, true));
      g.setIndex(new THREE.BufferAttribute(
        new Uint32Array(buffer, p.indices, p.indexCount), 1));
      g.boundingBox = new THREE.Box3(
        new THREE.Vector3().fromArray(p.bounds[0]),
        new THREE.Vector3().fromArray(p.bounds[1]));
      g.computeBoundingSphere();
      const mesh = new THREE.Mesh(g, matFor(p.system).clone());
      mesh.userData.partId = p.id;
      parts.set(p.id, { mesh, part: p });
      scene.add(mesh);
    }
    loaded++;
    overlayMsg.textContent =
      `Đang tải mô hình giải phẫu… ${Math.round(loaded / chunks.length * 100)}%`;
  }
  // 3 lượt tải song song, giống bản gốc.
  let cursor = 0;
  await Promise.all(Array.from({ length: 3 }, async () => {
    while (cursor < chunks.length) await loadChunk(cursor++);
  }));
  if (!parts.size) throw new Error('không giải mã được bộ phận nào');

  // ---------------- trạng thái ----------------
  const hidden = new Set();         // id bộ phận bị ẩn bằng nhấp đúp
  const sysVisible = {};            // hệ cơ quan -> bool
  for (const s of SYSTEM_ORDER) sysVisible[s] = !DEFAULT_HIDDEN.has(s);
  let focusIds = new Set();
  let selected = null;
  let query = '';

  function unionBox(ids) {
    const box = new THREE.Box3();
    for (const id of ids) {
      const p = parts.get(id);
      if (p) box.union(p.mesh.geometry.boundingBox);
    }
    return box.isEmpty() ? null : box;
  }
  function frameBox(box, pad = 1.35) {
    const c = box.getCenter(new THREE.Vector3());
    const s = box.getSize(new THREE.Vector3());
    const radius = Math.max(s.x, s.y, s.z) * 0.5 || 0.5;
    const dist = (radius / Math.tan((camera.fov * Math.PI) / 360)) * pad;
    const dir = new THREE.Vector3(0.55, 0.35, 1).normalize();
    camera.position.copy(c).addScaledVector(dir, dist);
    controls.target.copy(c);
    controls.update();
  }

  function applyVisibility() {
    const allowedSystems =
      (PARAMS.systems || []).length ? new Set(PARAMS.systems) : null;
    const q = query.trim().toLowerCase();
    for (const [id, { mesh, part }] of parts) {
      let vis = !hidden.has(id) && sysVisible[part.system];
      if (allowedSystems && !focusIds.has(id))
        vis = vis && allowedSystems.has(part.system);
      if (q && searchIds) {
        vis = vis && searchIds.has(id);
      }
      mesh.visible = vis;
    }
  }
  let searchIds = null; // Set | null; được điền qua resolveFocus để
                        // 'heart'… khớp cả khái niệm, không chỉ chuỗi con của tên

  const HIGHLIGHT = 0x6bd9c7;
  function paint() {
    for (const [id, { mesh }] of parts) {
      const m = mesh.material;
      const base = new THREE.Color(colors[parts.get(id).part.system] || '#aebbb8');
      if (selected === id) {
        m.color.copy(base).lerp(new THREE.Color(HIGHLIGHT), 0.8);
        m.emissive.setHex(0x0f766e);
      } else if (focusIds.has(id)) {
        m.color.copy(base).lerp(new THREE.Color(HIGHLIGHT), 0.35);
        m.emissive.setHex(0x000000);
      } else {
        m.color.copy(base);
        m.emissive.setHex(0x000000);
      }
    }
  }

  // Bí danh tiếng Việt -> thuật ngữ tiếng Anh mà bộ phân giải đã hiểu,
  // hoặc trực tiếp là khoá hệ cơ quan (system) trong dữ liệu atlas.
  const VN_ALIASES = {
    // hệ cơ quan
    'hệ xương': 'skeleton', 'bộ xương': 'skeleton', 'xương': 'skeleton',
    'hệ cơ': 'muscles', 'bắp': 'muscle', 'cơ': 'muscle',
    'hệ thần kinh': 'nervous system', 'thần kinh': 'nerves',
    'hệ tiêu hóa': 'digestive system', 'tiêu hóa': 'digestive system',
    'hệ hô hấp': 'respiratory system', 'hô hấp': 'respiratory system',
    'hệ tiết niệu': 'urinary system', 'tiết niệu': 'urinary system',
    'hệ tuần hoàn': 'circulatory system', 'tuần hoàn': 'circulatory system',
    'hệ bạch huyết': 'lymph nodes', 'bạch huyết': 'lymph nodes',
    'hệ nội tiết': 'endocrine', 'nội tiết': 'endocrine',
    'hệ sinh dục': 'reproductive', 'sinh dục': 'reproductive',
    'hệ giác quan': 'sensory', 'giác quan': 'sensory',
    'hệ bao phủ': 'integumentary', 'hệ da': 'skin', 'da': 'skin',
    'mô liên kết': 'connective',
    'động mạch': 'arteries', 'tĩnh mạch': 'veins', 'mạch máu': 'blood',
    'hệ tim': 'cardiac', 'tim': 'heart',
    // nội tạng
    'não': 'brain', 'bộ não': 'brain', 'phổi': 'lung', 'gan': 'liver',
    'thận': 'kidney', 'mắt': 'eye', 'dạ dày': 'stomach',
    'ruột': 'intestine', 'ruột non': 'small intestine', 'ruột già': 'colon',
    'đại tràng': 'colon', 'bàng quang': 'bladder', 'bọng đái': 'bladder',
    'tủy sống': 'spinal cord', 'máu': 'blood', 'lưỡi': 'tongue',
    'răng': 'tooth', 'mũi': 'nose', 'miệng': 'mouth', 'tai': 'ear',
    'khí quản': 'trachea', 'thực quản': 'esophagus', 'tụy': 'pancreas',
    'tuyến tụy': 'pancreas', 'lá lách': 'spleen', 'lách': 'spleen',
    'túi mật': 'gallbladder', 'cơ hoành': 'diaphragm', 'hoành': 'diaphragm',
    // xương và khớp
    'sọ': 'skull', 'hộp sọ': 'skull', 'xương sọ': 'skull',
    'hàm': 'jaw', 'xương hàm': 'mandible', 'đầu': 'head', 'mặt': 'face',
    'cổ': 'neck', 'cột sống': 'spine', 'xương sống': 'spine',
    'đốt sống': 'vertebrae', 'xương sườn': 'ribs', 'sườn': 'ribs',
    'xương ức': 'sternum', 'xương chậu': 'pelvis', 'chậu': 'pelvis',
    'hông': 'hip', 'xương đùi': 'femur', 'đùi': 'femur',
    'tay': 'arm', 'cánh tay': 'arm', 'chân': 'leg', 'bàn tay': 'hand',
    'bàn chân': 'foot', 'đầu gối': 'knee', 'gối': 'knee', 'vai': 'shoulder',
    'ngực': 'chest', 'lồng ngực': 'thorax', 'bụng': 'abdomen',
    'hạch bạch huyết': 'lymph nodes',
    // cơ
    'bắp tay': 'biceps brachii', 'cơ nhị đầu': 'biceps brachii',
    'cơ tứ đầu': 'quadriceps', 'cơ đùi trước': 'quadriceps',
    'cơ gân kheo': 'biceps femoris', 'cơ tam đầu': 'triceps brachii',
    'bắp chân': 'gastrocnemius', 'cơ mông': 'gluteus', 'cơ ngực': 'pectoralis',
  };
  // Bỏ dấu tiếng Việt để người dùng gõ không dấu vẫn tìm được.
  const foldVN = (s) => String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd')
    .replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
  const VN_ALIASES_FOLD = {};
  for (const [vi, en] of Object.entries(VN_ALIASES))
    VN_ALIASES_FOLD[foldVN(vi)] = en;

  // thuật ngữ -> id bộ phận, mô phỏng scenarios._resolve_term ở backend
  function resolveFocus(term) {
    let t = String(term || '').trim().toLowerCase();
    if (!t) return { ids: [] };
    // Bí danh tiếng Việt (tim, não, phổi, xương…) -> thuật ngữ tiếng Anh
    // hoặc hệ cơ quan, rồi đi tiếp theo đúng luồng phân giải cũ.
    const vi = VN_ALIASES[t] || VN_ALIASES[t.replace(/\s+/g, '_')] ||
      VN_ALIASES_FOLD[foldVN(t)];
    if (vi !== undefined) {
      if (systems[vi])
        return { ids: [...new Set(systems[vi].filter((e) => parts.has(e)))] };
      t = String(vi).toLowerCase();
    }
    const key = t.replace(/\s+/g, '_');
    if (parts.has(key)) return { ids: [key] };
    const asList = (v) => v == null ? [] : (Array.isArray(v) ? v : [v]);
    const spec = aliases[t] || aliases[key];
    if (spec !== undefined) {
      const out = [];
      if (typeof spec === 'string')
        return { ids: parts.has(spec) ? [spec] : [] };
      for (const cid of asList(spec.concept)) {
        const c = concepts[cid] || conceptByName[String(cid).toLowerCase()];
        if (c) out.push(...(c.elements || []).filter((e) => parts.has(e)));
      }
      for (const s of asList(spec.system))
        out.push(...(systems[s] || []).filter((e) => parts.has(e)));
      for (const sub of asList(spec.substr))
        for (const [id, p] of parts)
          if ((p.part.name || '').toLowerCase().includes(String(sub).toLowerCase()))
            out.push(id);
      out.push(...asList(spec.mesh).filter((m) => parts.has(m)));
      return { ids: [...new Set(out)] };
    }
    const c = conceptByName[t];
    if (c) {
      return { ids: [...new Set((c.elements || []).filter((e) => parts.has(e)))] };
    }
    const hits = [...parts.keys()].filter(
      (id) => (parts.get(id).part.name || '').toLowerCase().includes(t));
    if (hits.length) return { ids: hits };
    return { ids: [], notFound: true };
  }

  // ---------------- giao diện ----------------
  // Nhãn tiếng Việt cho các chip lọc; khoá lọc vẫn là id hệ cơ quan trong dữ liệu.
  const SYSTEM_LABELS = {
    skeletal: 'Hệ xương', muscular: 'Hệ cơ', nervous: 'Hệ thần kinh',
    sensory: 'Hệ giác quan', connective: 'Mô liên kết', arterial: 'Hệ động mạch',
    venous: 'Hệ tĩnh mạch', cardiac: 'Hệ tim', endocrine: 'Hệ nội tiết',
    digestive: 'Hệ tiêu hóa', respiratory: 'Hệ hô hấp',
    lymphatic: 'Hệ bạch huyết', integumentary: 'Hệ da',
    reproductive: 'Hệ sinh dục', urinary: 'Hệ tiết niệu',
  };
  const chipButtons = {};
  for (const s of SYSTEM_ORDER) {
    const b = document.createElement('button');
    b.textContent = SYSTEM_LABELS[s] || s;
    chipButtons[s] = b;
    b.onclick = () => {
      sysVisible[s] = !sysVisible[s];
      b.classList.toggle('off', !sysVisible[s]);
      applyVisibility();
    };
    if (!sysVisible[s]) b.classList.add('off');
    bar.appendChild(b);
  }
  const search = document.createElement('input');
  search.placeholder = 'Tìm kiếm — ví dụ: tim, xương đùi…';
  search.oninput = () => {
    query = search.value;
    searchIds = query.trim()
      ? new Set(resolveFocus(query).ids)
      : null;
    applyVisibility();
  };
  bar.appendChild(search);
  const resetBtn = document.createElement('button');
  resetBtn.textContent = 'Đặt lại';
  resetBtn.onclick = () => {
    hidden.clear(); focusIds.clear(); selected = null; query = '';
    search.value = ''; searchIds = null;
    for (const s of SYSTEM_ORDER) {
      sysVisible[s] = !DEFAULT_HIDDEN.has(s);
      chipButtons[s].classList.toggle('off', !sysVisible[s]);
    }
    applyVisibility(); paint();
    frameBox(unionBox([...parts.keys()]) ||
      new THREE.Box3(new THREE.Vector3(-1, -1, -1), new THREE.Vector3(1, 1, 1)));
  };
  bar.appendChild(resetBtn);

  // ---------------- sự kiện ----------------
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  function pick(ev) {
    const r = renderer.domElement.getBoundingClientRect();
    pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1,
                -((ev.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(
      [...parts.values()].filter((p) => p.mesh.visible).map((p) => p.mesh));
    return hits.length ? hits[0].object.userData.partId : null;
  }
  let downAt = 0, clickCount = 0, clickTimer = null;
  renderer.domElement.addEventListener('pointerdown',
    () => { downAt = performance.now(); });
  renderer.domElement.addEventListener('pointermove', (ev) => {
    if (ev.buttons) { tipEl.style.display = 'none'; return; }
    const id = pick(ev);
    if (id) {
      tipEl.textContent = structures[id]?.name || id;
      tipEl.style.display = 'block';
      tipEl.style.left = ev.clientX + 12 + 'px';
      tipEl.style.top = ev.clientY + 14 + 'px';
    } else tipEl.style.display = 'none';
  });
  renderer.domElement.addEventListener('pointerup', (ev) => {
    if (performance.now() - downAt > 350) return; // vừa rồi là thao tác kéo
    clickCount++;
    setTimeout(() => {
      const id = pick(ev);
      if (clickCount >= 2 && id) {          // nhấp đúp: bóc tách bộ phận ra
        hidden.add(id); applyVisibility();
      } else if (clickCount === 1 && id) {  // nhấp một lần: chọn + căn khung
        selected = selected === id ? null : id;
        paint();
        if (selected) {
          const box = unionBox([id]);
          if (box) frameBox(box, 2.2);
        }
      }
      clickCount = 0;
    }, 240);
  });

  // ---------------- focus từ tham số ----------------
  const f = resolveFocus(PARAMS.focus);
  focusIds = new Set(f.ids);
  if (f.notFound)
    statusEl.textContent = `"${PARAMS.focus}" không có trong mô hình`;
  else
    statusEl.textContent = 'kéo để xoay · nhấp đúp để ẩn một bộ phận';
  statusEl.title = 'Dữ liệu giải phẫu: BodyParts3D 4.0, CC BY 4.0';
  if (PARAMS.isolate && f.ids.length) {
    for (const [id] of parts) {
      if (!focusIds.has(id)) hidden.add(id);
    }
  }
  if (PARAMS.focus) {
    document.getElementById('title').textContent =
      'Giải phẫu 3D — ' + String(PARAMS.focus);
  }
  applyVisibility();
  paint();
  frameBox(unionBox(f.ids.length ? f.ids : [...parts.keys()]) ||
    new THREE.Box3(new THREE.Vector3(-1, -1, -1), new THREE.Vector3(1, 1, 1)));

  overlay.style.opacity = '0';
  setTimeout(() => overlay.remove(), 350);

  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
}

main().catch((e) => fail(e.message || String(e)));
</script>
</body>
</html>
